name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Deny by default; the job below requests only what it uses.
permissions: {}

# One release build per ref at a time. Never cancel a release mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # DOCKERHUB_* secrets live in this environment, which only v* tags may deploy to,
    # so branch and PR workflows can never read the registry credentials.
    environment: release
    permissions:
      contents: read      # checkout
      id-token: write     # OIDC for keyless cosign signing and Sigstore attestation certs
      attestations: write # persist build provenance via the GitHub attestations API
      # No packages: write: images go to Docker Hub with DOCKERHUB_* secrets, not GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: halopsa-mcp:release-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # trivy-action v0.36.0 defaults to Trivy v0.70.0 (CVE-2026-55092, CVE-2026-54448,
          # CVE-2026-63328). Pin a patched scanner explicitly.
          version: v0.76.1
          image-ref: halopsa-mcp:release-scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          format: table
          output: trivy-results.txt

      - name: Publish Trivy results to summary
        if: always()
        run: |
          {
            echo "### Release image scan (Trivy)"
            echo ""
            if [[ -s trivy-results.txt ]]; then
              echo '```'
              cat trivy-results.txt
              echo '```'
            else
              echo "_No results file — see job logs._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on vulnerabilities
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL or HIGH vulnerabilities (see job summary)"
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: redanthrax/halopsa-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet-CycloneDX ./HaloPsaMcp.csproj -o sbom -F Json -fn cyclonedx.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom-${{ github.ref_name }}
          path: sbom/cyclonedx.json
          if-no-files-found: error

      - name: Generate build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/redanthrax/halopsa-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
